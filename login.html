<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="robots" content="noindex, nofollow">
    <title>MVX GATEWAY | Premium Access V4.0</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #020617;
            --bg-panel: rgba(15, 23, 42, 0.7);
            --primary: #00e6b8;
            --primary-glow: 0 0 25px rgba(0, 230, 184, 0.3);
            --text-main: #f8fafc;
            --border-light: rgba(0, 230, 184, 0.2);
            --border-focus: rgba(0, 230, 184, 0.8);
            --font-tech: 'Orbitron', sans-serif;
            --font-body: 'Space Grotesk', sans-serif;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        body { 
            background-color: var(--bg-base); 
            color: var(--text-main); 
            font-family: var(--font-body); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            position: relative;
        }

        .cyber-grid {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background-image: linear-gradient(var(--border-light) 1px, transparent 1px), 
                              linear-gradient(90deg, var(--border-light) 1px, transparent 1px);
            background-size: 40px 40px; 
            opacity: 0.1; 
            z-index: 0; 
            pointer-events: none;
        }

        .gateway-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            z-index: 10;
        }

        .login-card { 
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 45px 35px; 
            border-radius: 20px; 
            border: 1px solid var(--border-light); 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), var(--primary-glow); 
            text-align: center; 
            transition: border-color 0.3s ease;
        }

        .login-card:hover { 
            border-color: var(--border-focus); 
        }

        .brand-header { 
            margin-bottom: 35px; 
        }

        .brand-icon { 
            font-size: 55px; 
            color: var(--primary); 
            margin-bottom: 15px; 
            filter: drop-shadow(0 0 10px var(--primary)); 
        }

        .brand-title { 
            font-family: var(--font-tech); 
            font-size: 32px; 
            font-weight: 900; 
            letter-spacing: 2px; 
            margin-bottom: 5px; 
            color: #ffffff;
        }

        .brand-title span { 
            color: var(--primary); 
        }

        .brand-subtitle { 
            font-family: 'Rajdhani', sans-serif; 
            color: var(--primary); 
            letter-spacing: 4px; 
            font-size: 13px; 
            font-weight: 700; 
            text-transform: uppercase; 
            background: rgba(0,230,184,0.1);
            display: inline-block; 
            padding: 4px 12px; 
            border-radius: 4px;
        }

        .auth-container { 
            position: relative; 
            margin-top: 20px;
        }
        
        .btn-google { 
            width: 100%; 
            padding: 16px; 
            background: #ffffff; 
            color: #020617; 
            border: 2px solid #ffffff; 
            border-radius: 10px; 
            font-family: var(--font-tech); 
            font-size: 16px; 
            font-weight: 700; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            cursor: pointer; 
            box-shadow: 0 0 20px rgba(255,255,255,0.2); 
            transition: all 0.3s ease; 
            overflow: hidden;
        }

        .btn-google svg { 
            width: 24px; 
            height: 24px;
            flex-shrink: 0;
        }

        .btn-google:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 5px 25px rgba(255,255,255,0.4); 
        }

        .btn-google:active { 
            transform: translateY(1px); 
        }

        .loader-overlay {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(2, 6, 23, 0.85); 
            backdrop-filter: blur(5px);
            border-radius: 20px; 
            display: none; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 100;
        }

        .spinner {
            width: 50px; 
            height: 50px; 
            border: 4px solid rgba(0, 230, 184, 0.2);
            border-top: 4px solid var(--primary); 
            border-radius: 50%;
            animation: spin 1s linear infinite; 
            margin-bottom: 15px;
        }

        .loader-text { 
            font-family: var(--font-tech); 
            color: var(--primary); 
            font-size: 15px; 
            letter-spacing: 2px;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

    </style>
</head>
<body>

    <div class="cyber-grid"></div>

    <div class="gateway-container">
        <div class="login-card">
            
            <div class="loader-overlay" id="systemLoader">
                <div class="spinner"></div>
                <div class="loader-text" id="loaderText">AUTHENTICATING...</div>
            </div>

            <div class="brand-header">
                <i class="fas fa-shield-alt brand-icon"></i>
                <h2 class="brand-title">MVX <span>STORE</span></h2>
                <div class="brand-subtitle">SECURE GATEWAY</div>
            </div>

            <div class="auth-container">
                <button id="authButton" class="btn-google" onclick="initiateLoginProtocol()">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    CONTINUE WITH GOOGLE
                </button>
            </div>

        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="firebase-config.js"></script>

    <script>
        // Trigger Direct Login Function
        function initiateLoginProtocol() {
            var button = document.getElementById('authButton');

            if (typeof window.startGoogleLogin === 'function') {
                if (button) {
                    button.disabled = true;
                    button.style.opacity = '0.7';
                    button.style.pointerEvents = 'none';
                }
                window.startGoogleLogin();
            } else {
                alert("Firebase login could not be initialized. Please check firebase-config.js.");
            }
        }
    </script>
</body>
</html>
